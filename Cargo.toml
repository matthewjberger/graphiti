[workspace]
members = ["playground"]
resolver = "2"

[package]
name = "graphiti"
version = "0.1.0"
description = "Diagrams as data: a serde schema in, a rendered image out"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/matthewjberger/graphiti"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "graphiti"
path = "src/main.rs"

[dependencies]
nalgebra-glm = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.nightshade]
version = "0.57.0"

[dependencies.nightshade-api]
version = "0.57.0"
default-features = false
features = ["engine"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
