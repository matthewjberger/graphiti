[package]
name = "playground"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
graphiti = { path = ".." }
protocol = { path = "../protocol" }
leptos = { version = "0.7", features = ["csr"] }
nightshade-leptos = { version = "0.57.0" }
nightshade-api = { version = "0.57.0", default-features = false, features = [
    "leptos",
] }
serde_json = "1"
wasm-bindgen = "=0.2.115"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "MouseEvent",
] }
